<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Insight - AI Sentiment Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              space: {
                950: '#0A0F1F', // Deep dark theme base
                900: '#111827',
                800: '#1F2937',
              },
              neon: {
                blue: '#3A8CFF',
                purple: '#A06BFF',
                cyan: '#2EF2FF',
              }
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'hero-glow': 'conic-gradient(from 180deg at 50% 50%, #0A0F1F 0%, #1a2342 50%, #0A0F1F 100%)',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #0A0F1F;
        color: #f8fafc;
        overflow-x: hidden;
      }
      
      /* Ambient Background Glows */
      .ambient-glow {
        position: fixed;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(58, 140, 255, 0.08) 0%, rgba(10, 15, 31, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: -1;
      }
      
      .glow-1 { top: -100px; left: -100px; }
      .glow-2 { bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(160, 107, 255, 0.08) 0%, rgba(10, 15, 31, 0) 70%); }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0F1F; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1F2937; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #374151; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
